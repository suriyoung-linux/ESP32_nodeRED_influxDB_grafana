; PlatformIO Project Configuration File
;
; This root config lets VS Code/PlatformIO treat the whole Grafana_NodeRed
; workspace as the project while keeping firmware sources under esp32_firmware/.

[platformio]
src_dir = esp32_firmware/src
include_dir = esp32_firmware/include
lib_dir = esp32_firmware/lib
test_dir = esp32_firmware/test
extra_configs = esp32_firmware/platformio.ini
