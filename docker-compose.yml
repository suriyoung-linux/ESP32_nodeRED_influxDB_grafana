services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
      - "${MQTT_WS_PORT}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - iot_net

  nodered:
    image: nodered/node-red:latest
    container_name: iot-nodered
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "${NODERED_PORT}:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - mqtt
      - influxdb
    networks:
      - iot_net

  influxdb:
    image: influxdb:2
    container_name: iot-influxdb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "${INFLUXDB_PORT}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - iot_net

  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - iot_net

networks:
  iot_net:
    name: iot_net

volumes:
  mqtt_data:
  mqtt_log:
  nodered_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
