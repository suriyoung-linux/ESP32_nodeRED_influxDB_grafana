name: esp32-project-level3

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - iot_net

x-timezone: &timezone
  TZ: ${TZ:-Asia/Bangkok}

services:
  mqtt:
    <<: *service-defaults
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  nodered:
    <<: *service-defaults
    build:
      context: ./nodered
    image: ${NODERED_IMAGE:-esp32-project-level3-nodered:latest}
    environment:
      <<: *timezone
      NODE_OPTIONS: --max-old-space-size=${NODERED_MAX_OLD_SPACE_MB:-256}
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - mqtt
      - influxdb

  influxdb:
    <<: *service-defaults
    image: ${INFLUXDB_IMAGE:-influxdb:2}
    environment:
      <<: *timezone
      INFLUXD_REPORTING_DISABLED: "true"
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:${INFLUXDB_DATA_PATH:-/var/lib/influxdb2}
      - influxdb_config:${INFLUXDB_CONFIG_PATH:-/etc/influxdb2}

  grafana:
    <<: *service-defaults
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      <<: *timezone
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-password}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb

networks:
  iot_net:

volumes:
  mqtt_data:
  mqtt_log:
  nodered_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
